<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="supported-color-schemes" content="light dark">
<title>Your NEXTBODY code</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Doto:wght@600;700&family=Inter+Tight:wght@800&family=Jost:wght@300;400;500&display=swap');
  :root { color-scheme: light dark; supported-color-schemes: light dark; }
  body { margin:0; padding:0; background-color:#0B0B0D; -webkit-text-size-adjust:100%; }
  a { color:#EFF65A; text-decoration:none; }
  /* Dark-mode clients invert a mail to "make it dark". This one already is: pin every colour. */
  @media (prefers-color-scheme: dark) {
    body, .nb-ground { background-color:#0B0B0D !important; background-image:linear-gradient(#0B0B0D,#0B0B0D) !important; }
    .nb-card { background-color:#101014 !important; background-image:linear-gradient(#101014,#101014) !important; border-color:#1F1F24 !important; }
    .nb-code { background-color:#0B0B0D !important; background-image:linear-gradient(#0B0B0D,#0B0B0D) !important; color:#FFFFFF !important; }
    .nb-white { color:#FFFFFF !important; }
    .nb-text2 { color:#9B9BA1 !important; }
    .nb-text3 { color:#8E8E95 !important; }
    .nb-pip { background-color:#EFF65A !important; background-image:linear-gradient(#EFF65A,#EFF65A) !important; }
  }
  [data-ogsc] .nb-white { color:#FFFFFF !important; }
  [data-ogsc] .nb-text2 { color:#9B9BA1 !important; }
  [data-ogsb] .nb-ground, [data-ogsb] .nb-code { background-color:#0B0B0D !important; }
  [data-ogsb] .nb-card { background-color:#101014 !important; }
</style>
</head>
<body class="nb-ground" bgcolor="#0B0B0D" style="margin:0;padding:0;background-color:#0B0B0D;background-image:linear-gradient(#0B0B0D,#0B0B0D);">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#0B0B0D" class="nb-ground" style="background-color:#0B0B0D;background-image:linear-gradient(#0B0B0D,#0B0B0D);">
  <tr><td align="center" bgcolor="#0B0B0D" class="nb-ground" style="background-color:#0B0B0D;background-image:linear-gradient(#0B0B0D,#0B0B0D);padding:40px 20px 48px;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:390px;">

      <!-- wordmark · the gate's own -->
      <tr><td style="padding:0 0 26px;">
        <span class="nb-white" style="font-family:'Inter Tight', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:26px;font-weight:800;letter-spacing:-0.045em;color:#FFFFFF;line-height:1;">NEXTBODY</span><span class="nb-pip" style="display:inline-block;vertical-align:top;width:7px;height:7px;background-color:#EFF65A;background-image:linear-gradient(#EFF65A,#EFF65A);border-radius:2px;margin:3px 0 0 7px;line-height:7px;font-size:0;">&nbsp;</span>
      </td></tr>

      <!-- card -->
      <tr><td bgcolor="#101014" class="nb-card" style="background-color:#101014;background-image:linear-gradient(#101014,#101014);border:1px solid #1F1F24;border-radius:18px;padding:26px 24px 24px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
          <tr><td class="nb-text3" style="font-family:'Doto', Menlo, Consolas, 'Courier New', monospace;font-size:11px;font-weight:600;letter-spacing:0.26em;color:#8E8E95;padding:0 0 18px;">SIGN IN · 6-DIGIT CODE</td></tr>
          <tr><td class="nb-white" style="font-family:'Jost', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:21px;font-weight:300;letter-spacing:0.02em;color:#FFFFFF;line-height:1.3;padding:0 0 8px;">Enter the code.</td></tr>
          <tr><td class="nb-text2" style="font-family:'Jost', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:14px;font-weight:400;color:#9B9BA1;line-height:1.5;padding:0 0 22px;">Type these six digits into the app. No password to set.</td></tr>
          <tr><td align="center" bgcolor="#0B0B0D" class="nb-code" style="background-color:#0B0B0D;background-image:linear-gradient(#0B0B0D,#0B0B0D);border:1px solid #1F1F24;border-radius:14px;padding:22px 12px;"><span class="nb-white" style="font-family:'Doto', Menlo, Consolas, 'Courier New', monospace;font-size:38px;font-weight:700;letter-spacing:0.26em;color:#FFFFFF;line-height:1;">{{ .Token }}</span></td></tr>
          <tr><td class="nb-text2" style="font-family:'Jost', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:13px;font-weight:400;color:#9B9BA1;line-height:1.5;padding:18px 0 0;border-top:1px solid #1F1F24;">It works once and expires in 10 minutes.</td></tr>
        </table>
      </td></tr>

      <!-- footer -->
      <tr><td class="nb-text3" style="font-family:'Doto', Menlo, Consolas, 'Courier New', monospace;font-size:10px;font-weight:600;letter-spacing:0.24em;color:#8E8E95;padding:22px 0 0;">TRAIN · RECOVER · REPEAT</td></tr>
      <tr><td class="nb-text3" style="font-family:'Jost', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:12px;color:#8E8E95;line-height:1.5;padding:8px 0 0;">If you didn't ask for this, ignore it. Nobody can get in without the code.</td></tr>
    </table>
  </td></tr>
</table>
</body>
</html>
