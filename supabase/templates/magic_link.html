<!doctype html>
<html>
  <body style="margin:0;padding:0;background:#0b0b0c;color:#f2f2f2;font-family:-apple-system,Helvetica,Arial,sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#0b0b0c;">
      <tr><td align="center" style="padding:48px 24px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:420px;">
          <tr><td style="font-size:22px;font-weight:800;letter-spacing:-0.04em;color:#ffffff;padding-bottom:28px;">
            NEXTBODY <span style="display:inline-block;width:8px;height:8px;background:#d9f24a;vertical-align:top;margin-top:4px;"></span>
          </td></tr>
          <tr><td style="font-size:15px;line-height:22px;color:rgba(255,255,255,0.82);padding-bottom:20px;">
            Your sign-in code. It works once and expires in 10 minutes.
          </td></tr>
          <tr><td style="font-size:36px;font-weight:700;letter-spacing:0.28em;color:#ffffff;font-family:Menlo,Consolas,monospace;padding:18px 0 28px;">
            {{ .Token }}
          </td></tr>
          <tr><td style="font-size:12px;line-height:18px;color:rgba(255,255,255,0.5);">
            If you didn't ask for this, ignore it. Nobody can sign in without the code.
          </td></tr>
        </table>
      </td></tr>
    </table>
  </body>
</html>
