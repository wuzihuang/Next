<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<meta name="supported-color-schemes" content="dark">
<title>Confirm it's you</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Doto:wght@600;700&family=Inter+Tight:wght@800&family=Jost:wght@300;400;500&display=swap');
  body { margin:0; padding:0; background-color:#0B0B0D; -webkit-text-size-adjust:100%; }
  a { color:#EFF65A; text-decoration:none; }
</style>
</head>
<body bgcolor="#0B0B0D" style="margin:0;padding:0;background-color:#0B0B0D;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#0B0B0D" style="background-color:#0B0B0D;">
  <tr><td align="center" bgcolor="#0B0B0D" style="background-color:#0B0B0D;padding:40px 20px 48px;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:390px;">

      <!-- wordmark · the gate's own -->
      <tr><td style="padding:0 0 26px;">
        <span style="font-family:'Inter Tight', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:26px;font-weight:800;letter-spacing:-0.045em;color:#FFFFFF;line-height:1;">NEXTBODY</span><span style="display:inline-block;width:7px;height:7px;background-color:#EFF65A;border-radius:2px;margin:0 0 12px 7px;line-height:0;font-size:0;">&nbsp;</span>
      </td></tr>

      <!-- card -->
      <tr><td bgcolor="#101014" style="background-color:#101014;border:1px solid #1F1F24;border-radius:18px;padding:26px 24px 24px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
          <tr><td style="font-family:'Doto', Menlo, Consolas, 'Courier New', monospace;font-size:11px;font-weight:600;letter-spacing:0.26em;color:#8E8E95;padding:0 0 18px;">CONFIRM · 6-DIGIT CODE</td></tr>
          <tr><td style="font-family:'Jost', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:21px;font-weight:300;letter-spacing:0.02em;color:#FFFFFF;line-height:1.3;padding:0 0 8px;">Confirm it's you.</td></tr>
          <tr><td style="font-family:'Jost', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:14px;font-weight:400;color:#9B9BA1;line-height:1.5;padding:0 0 22px;">A change to your account needs a second look. Enter this code in the app.</td></tr>
          <tr><td align="center" bgcolor="#0B0B0D" style="background-color:#0B0B0D;border:1px solid #1F1F24;border-radius:14px;padding:22px 12px;"><span style="font-family:'Doto', Menlo, Consolas, 'Courier New', monospace;font-size:38px;font-weight:700;letter-spacing:0.26em;color:#FFFFFF;line-height:1;">{{ .Token }}</span></td></tr>
          <tr><td style="font-family:'Jost', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:13px;font-weight:400;color:#9B9BA1;line-height:1.5;padding:18px 0 0;border-top:1px solid #1F1F24;">It works once and expires in 10 minutes.</td></tr>
        </table>
      </td></tr>

      <!-- footer -->
      <tr><td style="font-family:'Doto', Menlo, Consolas, 'Courier New', monospace;font-size:10px;font-weight:600;letter-spacing:0.24em;color:#8E8E95;padding:22px 0 0;">TRAIN · RECOVER · REPEAT</td></tr>
      <tr><td style="font-family:'Jost', 'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:12px;color:#8E8E95;line-height:1.5;padding:8px 0 0;">If you didn't ask for this, ignore it. Nobody can get in without the code.</td></tr>
    </table>
  </td></tr>
</table>
</body>
</html>
